# Lints, tests, then publishes the package to npm when a GitHub release is created.
# Uses npm Trusted Publishing (OIDC): no npm token. The package's trusted publisher on
# npmjs.com must name this repository and the workflow file npm-publish.yml.
# See: https://docs.npmjs.com/trusted-publishers

name: Publish to npm

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm verify this run instead of a token
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false # no shared cache in the job that publishes
      # Trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm publish --access public
